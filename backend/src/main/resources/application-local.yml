spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billiard_planner
    username: ${POSTGRES_USER:planner}
    password: ${POSTGRES_PASSWORD:planner_dev_password}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    fr.billiardplanner: DEBUG
    org.hibernate.SQL: INFO